[project]
name = "context-hub"
version = "0.1.0"
description = "Context orchestration infrastructure for coding agents."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.7,<3",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
  "tree-sitter>=0.23,<1",
  "httpx>=0.27,<1",
  "mcp>=1.0,<2",
]

[project.scripts]
ctx = "context_hub.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/context_hub"]

[tool.hatch.build.targets.sdist]
include = ["src/context_hub/**", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

